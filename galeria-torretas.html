<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería de torretas</title>
    <style>
      body { margin: 0; background: #1d2330; color: #e8ecf2; font-family: system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 2; background: #141820; padding: 8px 14px; display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #39414f; }
      h2 { margin: 0; font-size: 15px; }
      h3 { margin: 18px 14px 6px; font-size: 13px; color: #98c1d9; text-transform: uppercase; letter-spacing: 0.05em; }
      .grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px; }
      .cell { background: #2a3140; border-radius: 6px; padding: 2px; text-align: center; font-size: 11px; color: #8b95a5; }
      .cell canvas { display: block; image-rendering: pixelated; background: linear-gradient(#3b4a35, #2f3d2b); border-radius: 4px; }
      label { font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h2>Galería de torretas</h2>
      <label>Zoom <input id="zoom" type="range" min="1" max="4" step="0.5" value="2" /> <span id="zv">2×</span></label>
      <label>Rumbos <select id="dirs"><option value="8">8</option><option value="16">16</option><option value="4">4</option></select></label>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/view/gallery.ts"></script>
  </body>
</html>
