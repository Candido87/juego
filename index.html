<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fábrica isométrica</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2330; font-family: system-ui, sans-serif; color: #e8ecf2; }
      #app { position: fixed; inset: 0; }
      .panel { position: fixed; background: rgba(20, 24, 32, 0.85); border: 1px solid #39414f; border-radius: 8px; padding: 8px 12px; font-size: 14px; user-select: none; }
      #hud { top: 10px; left: 10px; display: flex; gap: 16px; align-items: center; }
      #hud b { color: #ffd166; }
      #toolbar { bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; }
      #toolbar button { background: #2a313d; color: #e8ecf2; border: 1px solid #46505f; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
      #toolbar button.active { background: #3d5a80; border-color: #98c1d9; }
      #toolbar button:hover { border-color: #98c1d9; }
      #dir { min-width: 28px; text-align: center; font-size: 18px; }
      #info { top: 10px; right: 10px; max-width: 280px; min-height: 18px; }
      #help { top: 58px; left: 10px; font-size: 12px; color: #aab3c0; line-height: 1.5; }
      #msg { top: 120px; left: 50%; transform: translateX(-50%); display: none; color: #ffd166; }
      #over { inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(10, 12, 18, 0.7); border: 0; border-radius: 0; font-size: 22px; }
      #over button { font-size: 16px; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel">
      <span>Créditos <b id="credits">0</b></span>
      <span>Núcleo <b id="core">100</b></span>
      <span>Oleada <b id="wave">0</b></span>
      <span>Siguiente en <b id="next">0</b>s</span>
      <button id="callWave">Adelantar oleada</button>
    </div>
    <div id="toolbar" class="panel">
      <button data-tool="drill">1 · Taladro</button>
      <button data-tool="belt">2 · Cinta</button>
      <button data-tool="tower">3 · Torre</button>
      <button data-tool="remove">4 · Quitar</button>
      <span>Dirección (R)</span><span id="dir">↘</span>
      <button id="pause">Pausa</button>
    </div>
    <div id="info" class="panel"></div>
    <div id="msg" class="panel"></div>
    <div id="help" class="panel">
      Clic: construir · Arrastrar: mover cámara · Rueda: zoom<br />
      Mayús + arrastrar: pintar cintas · R: girar · Esc / clic derecho: soltar herramienta<br />
      WASD / flechas: mover cámara
    </div>
    <div id="over" class="panel">
      <div id="overText">El núcleo ha caído</div>
      <button id="restart">Nueva partida</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
