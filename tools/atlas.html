<!doctype html>
<html><body style="background:#2b2f38;color:#fff;font:11px monospace;margin:8px">
<canvas id="c"></canvas>
<script>
const img = new Image();
img.src = '/assets/kenney/tiny-factory.png';
img.onload = () => {
  const S = 5, T = 16, C = 12, R = 11, cell = T * S + 4;
  const c = document.getElementById('c');
  c.width = C * cell; c.height = R * (cell + 12);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.font = '11px monospace';
  for (let i = 0; i < C * R; i++) {
    const col = i % C, row = Math.floor(i / C);
    const x = col * cell, y = row * (cell + 12);
    g.fillStyle = '#3a404c'; g.fillRect(x, y + 12, T * S, T * S);
    g.drawImage(img, col * T, row * T, T, T, x, y + 12, T * S, T * S);
    g.fillStyle = '#ffd166'; g.fillText(String(i), x + 2, y + 10);
  }
};
</script></body></html>
