<!doctype html>
<meta charset="utf-8">
<title>Torreta de balas: 2D frente a 3D</title>
<style>
  body { margin: 0; background: #1d2330; color: #e8ecf2; font: 14px system-ui, sans-serif; padding: 14px 18px; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row > b { width: 54px; color: #ffd166; }
  .c { width: 330px; height: 290px; border-radius: 6px; background: #2c3a28 center / cover no-repeat; position: relative; overflow: hidden; }
  .c.d3 { background-color: #9fd0e8; }
  .c span { position: absolute; left: 6px; top: 4px; font-size: 11px; background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 3px; }
  /* Recortes de la galería 2D (4 giros por nivel, celdas de 258 px; el giro de 90° queda en x=281). */
  .d2 { background-image: url(2d-bullet-completa.png); background-size: 1090px auto; }
  .l1 { background-position: -281px -80px; } .l2 { background-position: -281px -677px; } .l3 { background-position: -281px -1274px; }
  .d2 { background-size: 1090px auto; transform-origin: center; }
  .d3 img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; }
</style>
<h2>Torreta de balas: 2D (arriba) frente a 3D (abajo)</h2>
<div class="row"><b>2D</b>
  <div class="c"><div class="c d2 l1" style="width:258px;height:258px;margin:16px auto;transform:scale(1.1)"></div><span>nivel 1</span></div>
  <div class="c"><div class="c d2 l2" style="width:258px;height:258px;margin:16px auto;transform:scale(1.1)"></div><span>nivel 2</span></div>
  <div class="c"><div class="c d2 l3" style="width:258px;height:258px;margin:16px auto;transform:scale(1.1)"></div><span>nivel 3</span></div>
</div>
<div class="row"><b>3D</b>
  <div class="c d3"><img src="3d-balas-n1-135.png"><span>nivel 1</span></div>
  <div class="c d3"><img src="3d-balas-n2-45.png"><span>nivel 2</span></div>
  <div class="c d3"><img src="3d-balas-n3-135.png"><span>nivel 3</span></div>
</div>
